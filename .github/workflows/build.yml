name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # モデルは大きいのでリポジトリに入れず、ここでダウンロードする。
      #   SenseVoice（音声認識、約 230MB）と PLaMo 3 Translate 0.8B Q4_K_M（翻訳、約 0.57GB）
      # 一度ダウンロードしたものはキャッシュに取っておき、次からは使い回す。
      - name: Restore models from cache
        id: model-cache
        uses: actions/cache@v5
        with:
          path: Models
          key: models-sensevoice-2025-09-09-plamo3-0.8b-q4km-1cf96ae

      - name: Download models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p Models

          name=sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09
          curl -fSL --retry 3 -o "$RUNNER_TEMP/$name.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$name.tar.bz2"
          tar xjf "$RUNNER_TEMP/$name.tar.bz2" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/$name/model.int8.onnx" "$RUNNER_TEMP/$name/tokens.txt" Models/

          # PFN 公式のファイル。版がずれないように、リポジトリの版（コミット）を指定する。
          curl -fSL --retry 3 -o Models/plamo-3-translate-0.8b-Q4_K_M.gguf \
            "https://huggingface.co/pfnet/plamo-3-translate-0.8b-GGUF/resolve/1cf96ae02133958a20074bfdfab76517bb737d00/plamo-3-translate-0.8b-Q4_K_M.gguf"

      - name: Check models
        run: |
          ls -lh Models
          test -s Models/model.int8.onnx
          test -s Models/tokens.txt
          test "$(stat -f %z Models/plamo-3-translate-0.8b-Q4_K_M.gguf)" = "573126848"

      # 翻訳エンジン llama.cpp の iOS 用部品（約 63MB）。llama.cpp 公式の配布物を使う。
      # PLaMo 3 を正しく読むには b11455 以降が必要（トークナイザーや YaRN の直しが入っている）。
      # 中身がすり替わっていないか、指紋（SHA-256）で確かめる。
      - name: Download llama.cpp for iOS
        run: |
          set -euo pipefail
          tag=b12400
          curl -fSL --retry 3 -o "$RUNNER_TEMP/llama.zip" \
            "https://github.com/ggml-org/llama.cpp/releases/download/$tag/llama-$tag-xcframework.zip"
          echo "bf30e599eb8d7f7766f3278097028edca7a0ab449d5cee75ed6e82fadcdaf2ea  $RUNNER_TEMP/llama.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/llama.zip" -d "$RUNNER_TEMP/llama"
          rm -rf Vendor
          mkdir -p Vendor
          mv "$RUNNER_TEMP/llama/build-apple/llama.xcframework" Vendor/
          test -f Vendor/llama.xcframework/ios-arm64/llama.framework/llama

      # sherpa-onnx（Swift Package）のダウンロードも、キャッシュで使い回す
      - name: Restore Swift packages from cache
        uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Build iPhone app without signing
        run: |
          xcodebuild \
            -project LocalTranslator.xcodeproj \
            -scheme LocalTranslator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            'OTHER_LDFLAGS=$(inherited) -Wl,-no_adhoc_codesign' \
            build

      - name: Package unsigned IPA
        run: |
          app=build/Build/Products/Release-iphoneos/LocalTranslator.app
          test -f "$app/Info.plist"
          test -x "$app/LocalTranslator"
          test -s "$app/Models/model.int8.onnx"
          test -s "$app/Models/tokens.txt"
          test -s "$app/Models/plamo-3-translate-0.8b-Q4_K_M.gguf"
          # sherpa-onnx はアプリ本体に組み込まれているのに、Xcode が中身のない部品（抜け殻）を
          # Frameworks に置いてしまうので消す。llama.cpp（llama.framework）は本物の部品なので残す。
          echo "Frameworks before cleanup:"
          ls -la "$app/Frameworks" || true
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -mindepth 1 -maxdepth 1 ! -name 'llama.framework' -exec rm -rf {} +
          fi
          echo "Frameworks after cleanup:"
          ls -la "$app/Frameworks"
          test -f "$app/Frameworks/llama.framework/llama"
          otool -L "$app/LocalTranslator" | grep -i llama
          mkdir -p build/ipa/Payload
          ditto "$app" build/ipa/Payload/LocalTranslator.app
          cd build/ipa
          zip -qr LocalTranslator-unsigned.ipa Payload
          unzip -tq LocalTranslator-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: LocalTranslator-unsigned
          path: build/ipa/LocalTranslator-unsigned.ipa
          if-no-files-found: error
