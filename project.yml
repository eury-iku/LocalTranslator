name: LocalTranslator
packages:
  # 音声認識エンジン（SenseVoice を動かす）。Swift Package として Xcode が取ってくる。
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.1
  # 翻訳エンジン（PLaMo を動かす llama.cpp）。llama.cpp b10549 のビルド済み部品を使う。
  # PLaMo 3 に対応した新しい版が必要なので、版を固定している。
  llama-swift:
    url: https://github.com/mattt/llama.swift
    exactVersion: 2.10549.0
targets:
  LocalTranslator:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LocalTranslator
      # SenseVoice と PLaMo のモデル。リポジトリには入れず、GitHub Actions がビルドの前にダウンロードして置く。
      - path: Models
        type: folder
        optional: true
    dependencies:
      - package: sherpa-onnx
        product: sherpa-onnx
      - package: llama-swift
        product: LlamaSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localtranslator
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "話した言葉を文字にして翻訳するために、マイクを使います。音声は iPhone の中だけで処理され、外部には送信されません。"
schemes:
  LocalTranslator:
    build:
      targets:
        LocalTranslator: all
